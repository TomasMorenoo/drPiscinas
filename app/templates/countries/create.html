{% extends "base.html" %}
{% block title %}{% if country %}Editar Country{% else %}Crear Country{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-header bg-dark text-white py-3">
                <h2 class="h5 mb-0">
                    <i class="bi bi-tree-fill me-2"></i>
                    {% if country %}Editar Country{% else %}Agregar Nuevo Country{% endif %}
                </h2>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{% if country %}{{ url_for('country.editar_country', id=country.id) }}{% else %}{{ url_for('country.crear_country') }}{% endif %}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Nombre del Country</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-building"></i></span>
                            <input type="text" name="nombre" class="form-control form-control-lg"
                                   placeholder="Ej: Costa Esmeralda"
                                   value="{{ country.nombre if country else '' }}" required>
                        </div>
                        <div class="form-text">Ingresá el nombre comercial o legal del complejo.</div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                            {% if country %}
                                <i class="bi bi-floppy me-2"></i>Guardar cambios
                            {% else %}
                                <i class="bi bi-plus-circle-fill me-2"></i>Registrar Country
                            {% endif %}
                        </button>
                        <a href="{{ url_for('country.listar_countries') }}" class="btn btn-link text-muted">
                            <i class="bi bi-arrow-left"></i> Volver a la lista
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
