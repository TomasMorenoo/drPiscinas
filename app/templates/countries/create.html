{% extends "base.html" %}
{% block title %}Crear Country{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-header bg-dark text-white py-3">
                <h2 class="h5 mb-0"><i class="bi bi-tree-fill me-2"></i>Agregar Nuevo Country</h2>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('country.crear_country') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold">Nombre del Country</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-building"></i></span>
                            <input type="text" name="nombre" class="form-control form-control-lg" 
                                   placeholder="Ej: Costa Esmeralda" required>
                        </div>
                        <div class="form-text">Ingresá el nombre comercial o legal del complejo.</div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                            <i class="bi bi-plus-circle-fill me-2"></i>Registrar Country
                        </button>
                        <a href="{{ url_for('country.listar_countries') }}" class="btn btn-link text-muted">
                            <i class="bi bi-arrow-left"></i> Volver a la lista
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
