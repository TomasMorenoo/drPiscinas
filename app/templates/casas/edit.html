{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8 col-lg-6">
        
        <div class="card shadow border-0">
            <div class="card-header bg-dark text-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold text-uppercase">
                    <i class="bi bi-pencil-square me-2"></i> Editar Cliente
                </h5>
                <span class="badge bg-secondary border border-light">ID: {{ casa.id }}</span>
            </div>
            
            <div class="card-body p-4 bg-light">
                <form id="formEditar" method="POST" action="{{ url_for('casas.editar_casa', id=casa.id) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-uppercase text-muted">Country <span class="text-danger">*</span></label>
                        <select name="country_id" id="country_select" class="form-select" required onchange="cargarBarrios()">
                            {% for country in countries %}
                                <option value="{{ country.id }}" {% if country.id == casa.country_id %}selected{% endif %}>
                                    {{ country.nombre }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small text-uppercase text-muted">Barrio (Opcional)</label>
                        <select name="barrio_id" id="barrio_select" class="form-select">
                            <option value="">-- Ninguno --</option>
                            {% for barrio in barrios %}
                                <option value="{{ barrio.id }}" {% if barrio.id == casa.barrio_id %}selected{% endif %}>
                                    {{ barrio.nombre }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-7">
                            <label class="form-label fw-bold small text-uppercase text-muted">Número de Lote / Casa <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <input type="text" name="numero" id="numero" class="form-control fw-bold" value="{{ casa.numero }}" {% if casa.numero == 'S/N' %}disabled{% endif %} required>
                                <div class="input-group-text bg-white">
                                    <input class="form-check-input mt-0 me-2" type="checkbox" name="sin_numero" id="sinNumeroCheck" value="1" {% if casa.numero == 'S/N' %}checked{% endif %} onchange="toggleNumero()">
                                    <label class="form-check-label fw-bold small" for="sinNumeroCheck">S/N</label>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-5">
                            <label class="form-label fw-bold small text-uppercase text-muted">Abono Mensual <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-secondary">$</span>
                                <input type="text" name="precio_base" id="inputPrecio" class="form-control fw-bold text-end" value="{{ '{:,.0f}'.format(casa.precio_base) }}" required oninput="formatearMoneda(this)">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold small text-uppercase text-muted">Nombre del Cliente</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                                <input type="text" name="nombre_cliente" class="form-control fw-bold" value="{{ casa.nombre_cliente if casa.nombre_cliente else '' }}" placeholder="Ej: Juan Pérez">
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold small text-uppercase text-muted">Teléfono <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-whatsapp text-success"></i></span>
                                <input type="text" name="telefono" class="form-control fw-bold" value="{{ casa.telefono if casa.telefono else '' }}" placeholder="Ej: 1122334455" required>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold small text-uppercase text-muted">Email del Cliente (Opcional)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-envelope text-primary"></i></span>
                                <input type="email" name="email" class="form-control fw-bold" value="{{ casa.email if casa.email else '' }}" placeholder="Ej: cliente@correo.com">
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold small text-uppercase text-muted">Cliente Desde <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-calendar-event text-primary"></i></span>
                                <input type="date" name="fecha_creacion" id="fecha_creacion" class="form-control fw-bold"
                                       value="{{ casa.fecha_creacion.strftime('%Y-%m-%d') if casa.fecha_creacion else '' }}" required>
                            </div>
                            <div class="form-text small text-muted">Mes desde el que se factura al cliente.</div>
                        </div>
                    </div>

                    <hr class="text-muted mt-4">
                    
                    <div class="d-flex justify-content-end">
                        <a href="{{ url_for('casas.listar_casas') }}" class="btn btn-outline-secondary me-2 px-4 fw-bold shadow-sm">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4 fw-bold shadow-sm">
                            <i class="bi bi-save me-1"></i> Guardar Cambios
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. Lógica para el checkbox S/N
    function toggleNumero() {
        const check = document.getElementById('sinNumeroCheck');
        const input = document.getElementById('numero');
        if (check.checked) {
            input.value = ''; // Limpiamos el input si marcan S/N
            input.disabled = true;
            input.required = false;
        } else {
            input.disabled = false;
            input.required = true;
        }
    }

    // 2. Carga de barrios dinámica
    function cargarBarrios() {
        const countryId = document.getElementById('country_select').value;
        const barrioSelect = document.getElementById('barrio_select');
        barrioSelect.innerHTML = '<option value="">Cargando...</option>';

        if (!countryId) {
            barrioSelect.innerHTML = '<option value="">-- Seleccione un Country --</option>';
            return;
        }

        fetch(`/casas/barrios/${countryId}`)
            .then(response => response.json())
            .then(data => {
                barrioSelect.innerHTML = '<option value="">-- Ninguno --</option>';
                data.forEach(barrio => {
                    const option = document.createElement('option');
                    option.value = barrio.id;
                    option.textContent = barrio.nombre;
                    barrioSelect.appendChild(option);
                });
            })
            .catch(error => { console.error(error); });
    }

    // 3. Formateo de moneda argentina (Puntos para mil, coma para decimal)
    function formatearMoneda(input) {
        let value = input.value;
        let parts = value.split(',');
        let integerPart = parts[0].replace(/\D/g, "");
        integerPart = integerPart.replace(/\B(?=(\d{3})+(?!\d))/g, ".");

        let newValue = integerPart;
        if (parts.length > 1) {
            let decimalPart = parts[1].replace(/\D/g, "").substring(0, 2);
            newValue += "," + decimalPart;
        } else if (value.includes(',')) {
            newValue += ",";
        }
        input.value = newValue;
    }

    // 4. Limpieza para Python (Quitar puntos, cambiar coma por punto al enviar form)
    document.getElementById('formEditar').addEventListener('submit', function(e) {
        const input = document.getElementById('inputPrecio');
        if (input) {
            let valor = input.value;
            valor = valor.replace(/\./g, ""); // Borra los puntos
            valor = valor;  // Cambia coma por punto para la DB
            input.value = valor;
        }
    });
</script>
{% endblock %}
