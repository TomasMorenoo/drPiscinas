{% extends "base.html" %}
{% block title %}Nuevo Cliente - Dr. Piscinas{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                <h2 class="h4 mb-0 text-gray-800 fw-bold">
                    <i class="bi bi-house-add text-primary me-2"></i>Agregar Nuevo Cliente
                </h2>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('casas.crear_casa') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    
                    <div class="mb-3">
                        <label for="countrySelect" class="form-label fw-bold text-secondary small text-uppercase">Country <span class="text-danger">*</span></label>
                        <select name="country_id" id="countrySelect" class="form-select" required>
                            <option value="">-- Seleccionar Country --</option>
                            {% for country in countries %}
                                <option value="{{ country.id }}">{{ country.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="barrioSelect" class="form-label fw-bold text-secondary small text-uppercase">Barrio / Sector</label>
                        <select name="barrio_id" id="barrioSelect" class="form-select bg-light" disabled>
                            <option value="">Sin Barrio</option>
                        </select>
                        <div class="form-text small"><i class="bi bi-info-circle"></i> Se habilitará automáticamente si el country tiene barrios.</div>
                    </div>

                    <div class="mb-3">
                        <label for="numero" class="form-label fw-bold text-secondary small text-uppercase">Número o Lote <span class="text-danger">*</span></label>
                        <input type="text" name="numero" id="numero" class="form-control" placeholder="Ej: 43 o Lote 43" required>
                    </div>

                    <div class="mb-4">
                        <label for="precio_base" class="form-label fw-bold text-secondary small text-uppercase">Abono Base Mensual <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted fw-bold">$</span>
                            <input type="number" name="precio_base" id="precio_base" class="form-control font-monospace fs-5" step="0.01" placeholder="Ej: 35000" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                        <a href="{{ url_for('casas.listar_casas') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary fw-bold px-4 shadow-sm">
                            <i class="bi bi-save me-1"></i> Guardar Cliente
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const countrySelect = document.getElementById('countrySelect');
    const barrioSelect = document.getElementById('barrioSelect');

    countrySelect.addEventListener('change', function() {
        const countryId = this.value;

        // Limpiar y deshabilitar select barrio si no hay country
        barrioSelect.innerHTML = '<option value="">Sin Barrio</option>';
        barrioSelect.disabled = true;
        barrioSelect.classList.add('bg-light');

        if (countryId) {
            fetch(`/casas/barrios/${countryId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.length > 0) {
                        barrioSelect.disabled = false;
                        barrioSelect.classList.remove('bg-light');
                        barrioSelect.innerHTML = '<option value="">-- Seleccionar Barrio --</option>';
                        data.forEach(b => {
                            const option = document.createElement('option');
                            option.value = b.id;
                            option.textContent = b.nombre;
                            barrioSelect.appendChild(option);
                        });
                    }
                })
                .catch(err => console.error(err));
        }
    });
});
</script>
{% endblock %}
