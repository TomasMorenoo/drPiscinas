{% extends "base.html" %}
{% block title %}Nuevo Cliente - Dr. Piscinas{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                <h2 class="h4 mb-0 text-gray-800 fw-bold">
                    <i class="bi bi-house-add text-primary me-2"></i>Agregar Nuevo Cliente
                </h2>
            </div>
            <div class="card-body p-4">
                <form id="formCrear" method="POST" action="{{ url_for('casas.crear_casa') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    
                    <div class="mb-3">
                        <label for="countrySelect" class="form-label fw-bold text-secondary small text-uppercase">Country <span class="text-danger">*</span></label>
                        <select name="country_id" id="countrySelect" class="form-select" required>
                            <option value="">-- Seleccionar Country --</option>
                            {% for country in countries %}
                                <option value="{{ country.id }}">{{ country.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="barrioSelect" class="form-label fw-bold text-secondary small text-uppercase">Barrio / Sector</label>
                        <select name="barrio_id" id="barrioSelect" class="form-select bg-light" disabled>
                            <option value="">Sin Barrio</option>
                        </select>
                        <div class="form-text small"><i class="bi bi-info-circle"></i> Se habilitará automáticamente si el country tiene barrios.</div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-7">
                            <label for="numero" class="form-label fw-bold text-secondary small text-uppercase">Número o Lotes <span class="text-danger">*</span></label>
                            <div class="input-group shadow-sm">
                                <input type="text" name="numero" id="numero" class="form-control border-primary" placeholder="Ej: 43, 15, 20, E44" required>
                                <div class="input-group-text bg-white border-primary">
                                    <input class="form-check-input mt-0 me-2" type="checkbox" name="sin_numero" id="sinNumeroCheck" value="1" onchange="toggleNumero()">
                                    <label class="form-check-label fw-bold small text-primary" for="sinNumeroCheck">S/N</label>
                                </div>
                            </div>
                            <div class="form-text small text-primary" id="helpNumero"><strong>Carga múltiple:</strong> Varios separados por coma.</div>
                        </div>
                        
                        <div class="col-md-5">
                            <label for="precio_base" class="form-label fw-bold text-secondary small text-uppercase">Abono Mensual <span class="text-danger">*</span></label>
                            <div class="input-group shadow-sm">
                                <span class="input-group-text bg-light text-secondary">$</span>
                                <input type="text" name="precio_base" id="precio_base" class="form-control fw-bold border-secondary text-end" placeholder="Ej: 150.000" required oninput="formatearMoneda(this)">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-secondary small text-uppercase">Nombre del Cliente</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                <input type="text" name="nombre_cliente" class="form-control" placeholder="Ej: Juan Pérez">
                            </div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-secondary small text-uppercase">Teléfono <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-whatsapp text-success"></i></span>
                                <input type="text" name="telefono" class="form-control" placeholder="Ej: 1122334455" required>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary small text-uppercase">Email del Cliente (Opcional)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope text-primary"></i></span>
                            <input type="email" name="email" class="form-control" placeholder="Ej: cliente@correo.com">
                        </div>
                    </div>

                    <hr class="text-muted">

                    <div class="d-flex justify-content-end mt-4">
                        <a href="{{ url_for('casas.listar_casas') }}" class="btn btn-outline-secondary me-2 px-4 fw-bold shadow-sm">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4 fw-bold shadow-sm">
                            <i class="bi bi-save me-1"></i> Guardar Cliente
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
// 1. Lógica para el checkbox S/N
function toggleNumero() {
    const check = document.getElementById('sinNumeroCheck');
    const input = document.getElementById('numero');
    const help = document.getElementById('helpNumero');
    if (check.checked) {
        input.value = '';
        input.disabled = true;
        input.required = false;
        help.style.display = 'none';
    } else {
        input.disabled = false;
        input.required = true;
        help.style.display = 'block';
    }
}

// 2. Carga de barrios dinámica dependiente del Country
document.addEventListener('DOMContentLoaded', function() {
    const countrySelect = document.getElementById('countrySelect');
    const barrioSelect = document.getElementById('barrioSelect');

    countrySelect.addEventListener('change', function() {
        const countryId = this.value;

        barrioSelect.innerHTML = '<option value="">Sin Barrio</option>';
        barrioSelect.disabled = true;
        barrioSelect.classList.add('bg-light');

        if (countryId) {
            fetch(`/casas/barrios/${countryId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.length > 0) {
                        barrioSelect.disabled = false;
                        barrioSelect.classList.remove('bg-light');
                        barrioSelect.innerHTML = '<option value="">-- Seleccionar Barrio --</option>';
                        data.forEach(b => {
                            const option = document.createElement('option');
                            option.value = b.id;
                            option.textContent = b.nombre;
                            barrioSelect.appendChild(option);
                        });
                    }
                })
                .catch(err => console.error(err));
        }
    });
});

// 3. Formateo de moneda argentina visual (Puntos para mil, coma para decimal)
function formatearMoneda(input) {
    let value = input.value;
    let parts = value.split(',');
    let integerPart = parts[0].replace(/\D/g, "");
    integerPart = integerPart.replace(/\B(?=(\d{3})+(?!\d))/g, ".");

    let newValue = integerPart;
    if (parts.length > 1) {
        let decimalPart = parts[1].replace(/\D/g, "").substring(0, 2);
        newValue += "," + decimalPart;
    } else if (value.includes(',')) {
        newValue += ",";
    }
    input.value = newValue;
}

// 4. Limpieza para Python (Quitar puntos, cambiar coma por punto al enviar form)
document.getElementById('formCrear').addEventListener('submit', function(e) {
    const input = document.getElementById('precio_base');
    if (input) {
        let valor = input.value;
        valor = valor.replace(/\./g, ""); // Borra todos los puntos
        valor = valor;  // Cambia la coma por punto decimal para Python
        input.value = valor;
    }
});
</script>
{% endblock %}
