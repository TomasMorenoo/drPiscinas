<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Seguro | Dr. Piscinas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f0f2f5; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { max-width: 400px; width: 100%; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .brand-icon { font-size: 3rem; color: #212529; }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm border-0" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <div class="card login-card p-4">
                    <div class="card-body text-center">
                        <div class="mb-4">
                            <i class="bi bi-shield-lock-fill brand-icon"></i>
                            <h4 class="fw-bold mt-2">Acceso Restringido</h4>
                            <p class="text-muted small">Sistema de Gestión de Mantenimiento</p>
                        </div>

                        <form method="POST">
                            <div class="form-floating mb-3">
                                <input type="text" name="username" class="form-control" id="floatingInput" placeholder="Usuario" required autofocus>
                                <label for="floatingInput">Usuario</label>
                            </div>
                            <div class="form-floating mb-4">
                                <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Contraseña" required>
                                <label for="floatingPassword">Contraseña</label>
                            </div>

                            <button type="submit" class="btn btn-dark w-100 py-3 fw-bold text-uppercase mb-3">
                                <i class="bi bi-box-arrow-in-right me-2"></i> Ingresar
                            </button>
                        </form>
                    </div>
                    <div class="card-footer bg-white border-0 text-center pb-3">
                        <small class="text-muted">© 2026 Dr. Piscinas v1.0</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
