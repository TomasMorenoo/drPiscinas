{% extends "base.html" %}
{% block title %}Crear Producto{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-header bg-dark text-white py-3">
                <h2 class="h5 mb-0"><i class="bi bi-box-seam-fill me-2"></i>Agregar Nuevo Producto</h2>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('products.crear_product') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nombre del Producto</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-tag"></i></span>
                            <input type="text" name="nombre" class="form-control form-control-lg" 
                                   placeholder="Ej: Cloro Líquido" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Unidad de Medida</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-measuring-cup"></i></span>
                            <input type="text" name="unidad" class="form-control form-control-lg" 
                                   placeholder="kg, litro, pastilla..." required>
                        </div>
                        <div class="form-text">Cómo se fracciona el producto.</div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Precio Unitario</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light fw-bold">$</span>
                            <input type="number" step="0.01" name="precio" class="form-control form-control-lg" 
                                   placeholder="0.00" required>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                            <i class="bi bi-plus-circle-fill me-2"></i>Crear Producto
                        </button>
                        <a href="{{ url_for('products.listar_products') }}" class="btn btn-link text-muted">
                            <i class="bi bi-arrow-left"></i> Volver a la lista
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
