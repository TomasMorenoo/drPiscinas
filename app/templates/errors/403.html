{% extends "base.html" %}
{% block title %}Acceso denegado{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm overflow-hidden">
                <div style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); padding: 2.5rem 2rem 2rem; text-align:center;">
                    <div style="display:flex; justify-content:center; gap:0.5rem; margin-bottom:1rem;">
                        <i class="bi bi-shield-lock-fill text-white" style="font-size:3rem;"></i>
                    </div>
                    <span class="badge bg-white text-warning fw-bold px-3 py-2" style="font-size:0.8rem; letter-spacing:0.05em;">ERROR 403</span>
                </div>
                <div class="card-body p-4 p-md-5 text-center">
                    <h1 class="fw-bold mb-3" style="font-size:1.5rem; color:#92400e;">
                        Zona restringida
                    </h1>
                    <p class="text-muted mb-1">
                        Esta área de la pileta es solo para personal autorizado.
                    </p>
                    <p class="text-muted mb-4">
                        Si creés que es un error, contactá al administrador.
                    </p>
                    <hr class="my-4">
                    <div class="d-flex flex-column gap-2">
                        <a href="{{ url_for('main.home') }}" class="btn btn-warning fw-bold">
                            <i class="bi bi-house-door me-2"></i>Volver al inicio
                        </a>
                        <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-box-arrow-right me-1"></i>Cambiar de usuario
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
