<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>En Mantenimiento - Dr. Piscinas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .maint-card { max-width: 500px; text-align: center; padding: 40px; border-radius: 15px; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 5px solid #0dcaf0; }
        .icon-gear { font-size: 4rem; color: #0dcaf0; animation: spin 4s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="maint-card">
        <i class="bi bi-gear-fill icon-gear mb-3 d-inline-block"></i>
        <h2 class="fw-bold text-dark">Estamos mejorando el sistema</h2>
        <p class="text-muted mt-3">Dr. Piscinas se encuentra temporalmente en mantenimiento para traerte nuevas funcionalidades. Volveremos a estar en línea a la brevedad.</p>
        
        <p class="small text-secondary mt-4 mb-0">¿Sos administrador? <a href="{{ url_for('auth.login') }}" class="text-decoration-none">Ingresar</a></p>
    </div>
</body>
</html>
