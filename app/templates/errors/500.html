{% extends "base.html" %}
{% block title %}500 - Error de Sistema{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 card shadow-sm p-5 border-0">
            <i class="bi bi-exclamation-octagon-fill text-danger display-1 mb-4"></i>
            <h1 class="fw-bold text-dark">500</h1>
            <h2 class="h4 mb-4">Falla en los filtros</h2>
            <p class="text-muted mb-4">Algo salió mal internamente. Ya estamos revisando el motor de la base de datos para arreglarlo.</p>
            <hr class="my-4">
            <a href="{{ url_for('main.home') }}" class="btn btn-outline-dark">
                Intentar de nuevo
            </a>
        </div>
    </div>
</div>
{% endblock %}
