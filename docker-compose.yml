version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: dr_piscinas_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /vps/clientes/drPiscinas/db_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: dr_piscinas_app
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
    ports:
      - "5000:5000"