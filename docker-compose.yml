version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: dr_piscinas_db
    restart: always
    environment:
      # Aquí usamos las variables que coinciden con tu VPS y tu PC
      POSTGRES_USER: ${DB_USER:-drPiscinas}
      POSTGRES_PASSWORD: ${DB_PASS:-administrador}
      POSTGRES_DB: ${DB_NAME:-drPiscinas_db}
    ports:
      - "5433:5432"  # En tu PC usás 5433, en la VPS no molesta.
    volumes:
      - ./db_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: dr_piscinas_app
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
    ports:
      - "5000:5000"